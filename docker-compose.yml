services:
  proxmox-app:
    build: .
    container_name: proxmox-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped

  guac-websocket:
    build:
      context: ./guac-bridge
    container_name: guac-websocket
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY:-nscc-lab-portal-secret-key-39281}
    depends_on:
      - guacd

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - proxmox-app
      - guac-websocket
