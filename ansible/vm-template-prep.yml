---
# VM Template Preparation Playbook for Proxmox Windows Templates (OSYS1200)
#
# Prepares a clean Windows 11/Server VM to be converted to a Proxmox template:
#   - Verifies sysop / admin account
#   - Disables sleep, hibernation, and screen timeouts
#   - Enables Remote Desktop (RDP) and disables NLA for Guacamole compatibility
#   - Opens RDP (3389) and ICMP (Ping) in Windows Firewall
#   - Sets Windows Update to notify-only (prevents surprise mid-lab reboots)
#   - Ensures QEMU Guest Agent service is running and set to Automatic
#   - Cleans temporary files and flushes DNS before final shutdown
#
# Usage:
#   ansible-playbook playbooks/vm-template-prep.yml -e "ansible_user=sysop" --ask-pass
#   (or with vault / vars configured for the target host)

- name: Prepare Windows VM for Proxmox Template Conversion
  hosts: "{{ target_host | default('all') }}"
  gather_facts: true
  vars:
    admin_user: "{{ ansible_user | default('sysop') }}"

  tasks:
    - name: 1. Ensure sysop is in local Administrators group
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ admin_user }}"
        state: present

    - name: 2. Confirm WinRM listener configuration
      ansible.windows.win_shell: |
        (Get-ChildItem WSMan:\localhost\Listener | Where-Object { $_.Keys -contains "Transport=HTTP" }).Count
      register: http_listeners
      changed_when: false

    - name: 3. Set Windows Update to notify only (AUOptions = 2)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: AUOptions
        data: 2
        type: dword

    - name: 4. Disable system sleep and monitor timeouts on AC power
      ansible.windows.win_shell: |
        powercfg /change standby-timeout-ac 0
        powercfg /change monitor-timeout-ac 0
        powercfg /change hibernate-timeout-ac 0
      changed_when: true

    - name: 5. Enable Remote Desktop (fDenyTSConnections = 0)
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: 6. Disable Network Level Authentication (NLA) for Guacamole & direct RDP
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 0
        type: dword

    - name: 7. Configure Windows Firewall for Remote Desktop and ICMP
      ansible.windows.win_shell: |
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        Enable-NetFirewallRule -Name "FPS-ICMP4-ERQ-In" -ErrorAction SilentlyContinue
      changed_when: false

    - name: 8. Verify and enable QEMU Guest Agent service
      ansible.windows.win_service:
        name: QEMU-GA
        start_mode: auto
        state: started
      ignore_errors: true

    - name: 9. Flush DNS client cache
      ansible.windows.win_shell: Clear-DnsClientCache
      changed_when: false

    - name: 10. Clean temp directories
      ansible.windows.win_shell: |
        Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
      changed_when: false
      ignore_errors: true

    - name: 11. Final notification
      ansible.builtin.debug:
        msg: >-
          VM template preparation complete. Shut down the VM cleanly,
          move its disks to Ceph_VM_Storage in Proxmox, and convert it to a template.
