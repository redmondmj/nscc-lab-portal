---
# OSYS1200 Lab 2 Automated Audit Playbook
# Windows 11 Tools and Utilities
#
# Usage:
#   ansible-playbook -i inventory.py audit-lab2.yml --limit osys1200 --ask-pass

- name: Audit OSYS1200 Lab 2 Configuration
  hosts: "{{ target | default('osys1200') }}"
  gather_facts: false
  tasks:
    - name: Ensure local results directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/audit_results"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Run Lab 2 System Audit Script
      ansible.windows.win_shell: "{{ lookup('file', playbook_dir ~ '/audit-lab2.ps1') }}"
      register: audit_raw
      changed_when: false

    - name: Parse Audit Results
      ansible.builtin.set_fact:
        audit: "{{ audit_raw.stdout | from_json }}"

    - name: Save Host Result to Local JSON
      ansible.builtin.copy:
        content: "{{ audit_raw.stdout }}"
        dest: "{{ playbook_dir }}/audit_results/lab2-{{ inventory_hostname }}.json"
      delegate_to: localhost

    - name: Display Lab 2 Audit Summary
      ansible.builtin.debug:
        msg: >-
          [{{ audit.Student }} on {{ audit.Host }}] Score: {{ audit.PassedCount }}/{{ audit.TotalChecks }} ({{ audit.ScorePercent }}%) |
          ExecPolicy: {{ 'PASS' if audit.Checks.ExecutionPolicy.Pass else 'FAIL' }} |
          CustomMMC: {{ 'PASS' if audit.Checks.CustomMMC.Pass else 'FAIL' }} |
          TaskHistory: {{ 'PASS' if audit.Checks.TaskSchedulerHistory.Pass else 'FAIL' }} |
          CleanTempScript: {{ 'PASS' if audit.Checks.CleanTempScript.Pass else 'FAIL' }} |
          ScheduledTask: {{ 'PASS' if audit.Checks.ScheduledTask.Pass else 'FAIL' }} |
          AutoPlay: {{ 'PASS' if audit.Checks.AutoPlay.Pass else 'FAIL' }}
